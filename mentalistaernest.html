<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>brr brr patapim</title>
  <style>
    :root { font-family: system-ui, -apple-system, Segoe UI, sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); background: white; padding: 32px; border: 1px solid #dbe2ee; border-radius: 18px; box-shadow: 0 16px 50px #16244012; }
    .tag { color: #3457d5; font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0; font-size: clamp(1.6rem, 5vw, 2.2rem); }
    p { line-height: 1.6; color: #536078; }
    .notice { margin: 22px 0; padding: 14px 16px; background: #f2f5fc; border-radius: 12px; font-size: .93rem; }
    label { display: flex; gap: 11px; align-items: flex-start; line-height: 1.5; margin: 20px 0; }
    input { margin-top: 5px; accent-color: #3457d5; }
    button { width: 100%; border: 0; border-radius: 10px; padding: 13px 18px; background: #3457d5; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { min-height: 1.5em; margin-bottom: 0; font-size: .92rem; }
    code { overflow-wrap: anywhere; }
    @media (prefers-color-scheme: dark) {
      :root { color: #eef2ff; background: #101522; }
      main { background: #191f2e; border-color: #30384c; }
      p { color: #b8c2d8; }
      .notice { background: #222a3b; }
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">Jawna zgoda</div>
    <h1>jestes sigma</h1>
    <p>jak jest kupa to jest tez dupa.</p>
    <div class="notice"><strong>Informacja:</strong> jestem kupa z dupa</div>
    <label><input id="consent" type="checkbox"><span>jestem sigma.</span></label>
    <button id="send" disabled>moj wujek ma lizme</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    // Wstaw URL webhooka przed udostępnieniem strony. URL webhooka będzie widoczny dla odwiedzających.
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1565824605338345493/IdeRdJJbFtrUfWudiEgVWs-NH9PYG6UOZgu80jXAHK0-64F9kLpv4WfWKJP62YtERc_c";
    const consent = document.querySelector("#consent");
    const button = document.querySelector("#send");
    const status = document.querySelector("#status");
    consent.addEventListener("change", () => { button.disabled = !consent.checked; });
    button.addEventListener("click", async () => {
      if (!consent.checked) return;
      if (!DISCORD_WEBHOOK_URL.startsWith("https://discord.com/api/webhooks/")) {
        status.textContent = "Najpierw skonfiguruj URL webhooka w pliku HTML.";
        return;
      }
      button.disabled = true;
      status.textContent = "Pobieram adres IP…";
      try {
        const response = await fetch("https://api.ipify.org?format=json", { cache: "no-store" });
        if (!response.ok) throw new Error("Nie udało się pobrać adresu IP.");
        const { ip } = await response.json();
        status.textContent = `Twój publiczny adres IP: ${ip}. Wysyłam…`;
        const sent = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: `kupa ip: ${ip}` })
        });
        if (!sent.ok) throw new Error("siurek.");
        status.textContent = `Twój publiczny adres IP: ${ip}`;
      } catch (error) {
        status.textContent = error.message || "Wystąpił błąd podczas wysyłania.";
      } finally {
        button.disabled = !consent.checked;
      }
    });
  </script>
</body>
</html>
